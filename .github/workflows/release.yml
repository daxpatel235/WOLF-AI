name: Release

# Push a tag like v2.0.0 to build the Windows app and publish a GitHub release.
# The tag must match backend/version.py and have a section in CHANGELOG.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash # stops on the first failing command, also on Windows

jobs:
  release:
    name: Build & publish ${{ github.ref_name }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check tag matches app version
        id: version
        shell: pwsh
        run: |
          $version = (python -c "from backend.version import __version__; print(__version__)").Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match backend/version.py ($version)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Release notes from CHANGELOG.md
        run: python scripts/release_notes.py "${{ steps.version.outputs.version }}" release-notes.md

      - name: Lint
        run: ruff check .

      - name: JavaScript syntax
        run: node --check Web/script.js

      - name: Tests
        run: python -m pytest -v -rs

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File -Include *.msi,*.exe,*.zip -Recurse |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          gh release create "${{ github.ref_name }}" `
            "dist/WolfAI-$v-x64.msi" `
            "dist/WolfAI-$v-portable.exe" `
            "dist/WolfAI-$v-win64.zip" `
            "dist/SHA256SUMS.txt" `
            --title "Wolf AI $v" `
            --notes-file release-notes.md `
            --verify-tag
