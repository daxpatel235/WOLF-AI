name: Release

# Push a tag like v2.0.0 to build, check and publish every installer as a GitHub release.
# The tag must match backend/version.py and have a section in CHANGELOG.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Check version & test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check tag matches app version
        id: version
        run: |
          version="$(python -c 'from backend.version import __version__; print(__version__)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match backend/version.py (${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Release notes exist in CHANGELOG.md
        run: python scripts/release_notes.py "${{ steps.version.outputs.version }}" release-notes.md

      - name: Lint
        run: ruff check .

      - name: JavaScript syntax
        run: node --check Web/script.js

      - name: Tests
        run: python -m pytest -v -rs

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  installers:
    name: Installers
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publish GitHub release
    needs: [prepare, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Check every installer is present
        run: |
          v="${{ needs.prepare.outputs.version }}"
          for f in "WolfAI-$v-x64-setup.exe" "WolfAI-$v-x64.msi" \
                   "WolfAI-$v-aarch64.dmg" "WolfAI-$v-x64.dmg" \
                   "WolfAI-$v-amd64.AppImage" "WolfAI-$v-amd64.deb" "WolfAI-$v-x86_64.rpm"; do
            [ -s "assets/$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          (cd assets && sha256sum WolfAI-* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.prepare.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Wolf AI $v" \
            --notes-file assets/release-notes.md \
            --verify-tag \
            assets/WolfAI-* assets/SHA256SUMS.txt
